<!doctype html>
<html><head><meta charset="utf-8">
<title>rank badge preview · 5 tiers</title>
<style>
  body{margin:0;padding:20px;font:13px/1.4 "Roboto","Noto Sans SC",sans-serif;background:#555;color:#fff}
  .board{padding:16px 20px;margin-bottom:14px;border-radius:12px}
  .dark{background:#07090D;color:#F2F5F9}
  .light{background:#F2F5F8;color:#0F1720}
  .nature{background:#F4F1E9;color:#241F17}
  .row{display:flex;align-items:center;gap:26px;padding:10px 0;border-bottom:1px dashed rgba(128,128,128,.4)}
  .row:last-child{border-bottom:0}
  .lbl{width:104px;font-family:monospace;font-size:11px;letter-spacing:.08em;opacity:.75}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .cell span{font-family:monospace;font-size:9px;opacity:.55}
  .rk-ico{display:block}
  .rk-24{width:24px;height:24px}
  .rk-32{width:32px;height:32px}
  .rk-48{width:48px;height:48px}
  h2{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head>

</svg>
<div class="board dark"><h2>DARK · 三段尺寸（1x CSS px）· 现有五档</h2><div id="d"></div></div>
<div class="board light"><h2>LIGHT · 三段尺寸</h2><div id="l"></div></div>
<div class="board nature"><h2>NATURE / 咖啡纸感 · 三段尺寸（单色 currentColor）</h2><div id="n"></div></div>
<script>
var ids=['bronze','silver','gold','diamond','master'];
var host={d:document.getElementById('d'),l:document.getElementById('l'),n:document.getElementById('n')};
function ico(id,size,mono){
  return '<svg class="rk-ico rk-'+size+'"><use href="#rk-'+id+(mono?'-mono':'')+'"/></svg>';
}
ids.forEach(function(id){
  var row=document.createElement('div');row.className='row';
  row.innerHTML='<div class="lbl">rk-'+id+'</div>'
   +[24,32,48].map(function(s){return '<div class="cell"><span>'+s+'px</span>'+ico(id,s,false)+'</div>';}).join('')
   +[24,32,48].map(function(s){return '<div class="cell"><span>mono '+s+'</span>'+ico(id,s,true)+'</div>';}).join('');
  host.d.appendChild(row.cloneNode(true));host.l.appendChild(row.cloneNode(true));host.n.appendChild(row.cloneNode(true));
});
</script>
</body></html>
