<!-- Rank badge symbol sprite · single graphic source for the whole app.
     Inline this <svg> once into template.html's body; callers only write
       <svg class="rk-ico rk-24"><use href="#rk-bronze"/></svg>
     symbol ids derive from GL_RANKS[i].id: rk-{id} (color) / rk-{id}-mono (currentColor).
     Gradient mid-stop = GL_RANKS[i].color; do not recolor anywhere else. -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rk-g-bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3A468"/><stop offset=".48" stop-color="#CD7F32"/><stop offset="1" stop-color="#7A3F10"/>
    </linearGradient>
    <linearGradient id="rk-g-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6FB"/><stop offset=".45" stop-color="#C0C8D4"/><stop offset="1" stop-color="#8893A3"/>
    </linearGradient>
    <linearGradient id="rk-g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE39B"/><stop offset=".45" stop-color="#F3C97D"/><stop offset="1" stop-color="#94640D"/>
    </linearGradient>
    <linearGradient id="rk-g-diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDF3FF"/><stop offset=".45" stop-color="#38BDF8"/><stop offset="1" stop-color="#0A6C9E"/>
    </linearGradient>
    <linearGradient id="rk-g-master" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB0BC"/><stop offset=".45" stop-color="#F43F5E"/><stop offset="1" stop-color="#8F0F28"/>
    </linearGradient>
  </defs>

  <symbol id="rk-bronze" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="26" fill="url(#rk-g-bronze)"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#F7DDBF" stroke-width="1.6" opacity=".65"/>
